name: Debian packages

# Fork-only workflow: builds WiVRn server .deb packages for Debian trixie
# (amd64 + arm64) from any upstream ref. Run manually from the Actions tab.
#
#   ref = upstream tag (e.g. v26.9) -> version from metainfo, e.g. 26.9-1
#   ref = branch or commit          -> nightly version, e.g. 26.9-12-gbc3e374b-1

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream (WiVRn/WiVRn) tag, branch or commit to build'
        required: true
        default: 'master'
      release:
        description: 'Publish a GitHub release (tagged <upstream tag>-trixie, or nightly-<version>-trixie)'
        type: boolean
        default: false

env:
  UPSTREAM: WiVRn/WiVRn

jobs:
  build:
    name: Build trixie ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    outputs:
      is_tag: ${{ steps.ref.outputs.is_tag }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:

    - name: Install base tools
      run: |
        apt-get update
        apt-get install --yes --no-install-recommends git wget ca-certificates python3 devscripts equivs

    - uses: actions/checkout@v6
      with:
        repository: ${{ env.UPSTREAM }}
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        fetch-tags: true
        path: wivrn

    - name: Resolve ref
      id: ref
      working-directory: wivrn
      env:
        REF: ${{ inputs.ref }}
      run: |
        git config --global --add safe.directory "$PWD"
        if git show-ref --verify --quiet "refs/tags/$REF"; then
          echo "is_tag=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_tag=false" >> "$GITHUB_OUTPUT"
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        git describe --tags --always

    - name: Add dashboard runtime dependencies
      working-directory: wivrn
      # QML modules are loaded at runtime, so ${shlibs:Depends} cannot find them
      run: |
        QML_DEPENDS="qml6-module-qtquick, qml6-module-qtqml, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-dialogs, qml6-module-qtquick-templates, qml6-module-qtcore, qml6-module-qt-labs-platform, qml6-module-org-kde-kirigami, qml6-module-org-kde-kirigamiaddons-formcard, qml6-module-org-kde-coreaddons, qml6-module-org-kde-desktop"
        grep -q '^ ${misc:Depends},$' debian/control
        sed -i "s/^ \${misc:Depends},\$/ \${misc:Depends},\n $QML_DEPENDS,\nRecommends:\n kde-style-breeze,\n avahi-daemon,/" debian/control
        sed -n '/^Package:/,$p' debian/control

    - name: Install build dependencies
      working-directory: wivrn
      run: |
        mk-build-deps --install --remove --tool "apt-get --yes --no-install-recommends" debian/control
        # Dashboard and server dependencies not listed in debian/control
        apt-get install --yes --no-install-recommends \
          qt6-declarative-dev qt6-declarative-private-dev extra-cmake-modules \
          libkirigami-dev libkf6i18n-dev libkf6coreaddons-dev libkf6qqc2desktopstyle-dev libkf6iconthemes-dev \
          qml6-module-org-kde-kirigamiaddons-formcard \
          libssl-dev librsvg2-dev librsvg2-bin libarchive-dev libpng-dev libdrm-dev \
          libglib2.0-dev libglib2.0-dev-bin gettext spirv-tools pkexec

    - name: Download monado
      working-directory: wivrn
      run: |
        MONADO_COMMIT=$(cat monado-rev)
        wget -q https://gitlab.freedesktop.org/monado/monado/-/archive/$MONADO_COMMIT/monado-$MONADO_COMMIT.tar.gz -O ../monado.tar.gz
        mkdir monado-src
        tar xzf ../monado.tar.gz --strip-components=1 -C monado-src

    - name: Patch monado
      working-directory: wivrn/monado-src
      run: |
        for p in ../patches/monado/*; do
          patch -p1 --fuzz=0 --forward < "$p"
        done

    - name: Download stb
      working-directory: wivrn
      run: |
        STB_COMMIT=$(grep -oP 'nothings/stb/archive/\K[0-9a-f]+' CMakeLists.txt)
        wget -q https://github.com/nothings/stb/archive/$STB_COMMIT.tar.gz -O ../stb.tar.gz
        mkdir stb-src
        tar xzf ../stb.tar.gz --strip-components=1 -C stb-src

    - name: Generate changelog
      working-directory: wivrn
      run: >
        tools/gen_debian_changelog.py
        --out debian/changelog
        ${{ (steps.ref.outputs.is_tag == 'true' && '' ) || '--nightly' }}
        --author "github-actions <41898282+github-actions@users.noreply.github.com>"
        --distribution trixie;
        cat debian/changelog

    - name: Build package
      working-directory: wivrn
      run: dpkg-buildpackage --build=binary --no-sign

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: wivrn-trixie-${{ matrix.arch }}
        path: '*.deb'

  release:
    name: Publish release
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        path: debs
        pattern: wivrn-trixie-*
        merge-multiple: true

    - name: Release name
      id: name
      env:
        REF: ${{ inputs.ref }}
        IS_TAG: ${{ needs.build.outputs.is_tag }}
      run: |
        # Package version from the file name, e.g. wivrn_26.9-1_amd64.deb -> 26.9-1
        VERSION=$(basename debs/wivrn_*_amd64.deb | cut -d_ -f2)
        # Distinct tag names so they never clash with upstream's tags
        if [ "$IS_TAG" = true ]; then
          echo "tag=$REF-trixie" >> "$GITHUB_OUTPUT"
        else
          echo "tag=nightly-$VERSION-trixie" >> "$GITHUB_OUTPUT"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        # The tag goes on this fork's commit: GITHUB_TOKEN may not create tags on
        # upstream commits whose .github/workflows differ from this repository's
        tag_name: ${{ steps.name.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: WiVRn ${{ steps.name.outputs.version }} (Debian trixie)
        body: |
          Debian trixie packages (amd64, arm64) built from [${{ env.UPSTREAM }}@${{ inputs.ref }}](https://github.com/${{ env.UPSTREAM }}/tree/${{ needs.build.outputs.sha }}) (`${{ needs.build.outputs.sha }}`).
        prerelease: ${{ needs.build.outputs.is_tag != 'true' }}
        files: debs/wivrn_*.deb
